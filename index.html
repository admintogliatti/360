<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>360° Панорама</title>
    <style>
        body { margin: 0; overflow: hidden; }
        /* Маленькая подсказка для удобства (исчезает через 3 секунды) */
        .hint {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.5);
            padding: 8px;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(4px);
            transition: opacity 1s;
        }
    </style>
    <!-- Подключаем A-Frame (библиотека для 360) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <!-- Сцена с панорамой. Фото берётся из picture.jpg в той же папке -->
    <a-scene>
        <a-sky src="picture.jpg" rotation="0 -90 0"></a-sky>
    </a-scene>

    <div class="hint" id="hint">🖱️ Зажми и тащи мышью | На телефоне — води пальцем</div>
    <script>
        // Убираем подсказку через 3 секунды, чтобы не мешала
        setTimeout(() => {
            const hint = document.getElementById('hint');
            if (hint) hint.style.opacity = '0';
        }, 3000);
    </script>
</body>
</html>
